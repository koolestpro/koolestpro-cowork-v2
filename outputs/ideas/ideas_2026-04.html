<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>April 2026 Ideas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #090909;
    --card: #111111;
    --card-2: #171717;
    --border: rgba(255,255,255,0.1);
    --text: #ffffff;
    --text-dim: rgba(255,255,255,0.65);
    --text-faint: rgba(255,255,255,0.36);
    --grad: linear-gradient(135deg, #FF9500 0%, #E040A0 50%, #7B2FBE 100%);
    --syne: 'Syne', sans-serif;
    --mono: 'DM Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(circle at top right, rgba(224,64,160,0.14), transparent 25%), #090909;
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
    padding: 32px 20px 72px;
  }
  .wrap { max-width: 1280px; margin: 0 auto; }
  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 10px;
  }
  h1 {
    font-family: var(--syne);
    font-size: clamp(34px, 6vw, 60px);
    line-height: 1;
    margin-bottom: 14px;
  }
  .sub {
    max-width: 760px;
    color: var(--text-dim);
    margin-bottom: 24px;
  }
  .rule { height: 2px; background: var(--grad); border-radius: 999px; margin-bottom: 28px; }
  .nav {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .nav a, .nav button {
    font-family: var(--mono);
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.03);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 999px;
    text-decoration: none;
    cursor: pointer;
  }
  .nav a:hover, .nav button:hover { background: var(--grad); border-color: transparent; }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
  }
  .stat small {
    display: block;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 8px;
  }
  .stat strong {
    display: block;
    font-family: var(--syne);
    font-size: 34px;
    line-height: 1;
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .toolbar {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .toolbar button, .toolbar input {
    font-family: var(--mono);
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    padding: 10px 14px;
  }
  .toolbar button.active {
    background: var(--grad);
    border-color: transparent;
  }
  .toolbar input { min-width: 220px; border-radius: 12px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .card {
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card-head, .card-meta, .card-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .badge, .priority, .mini {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border-radius: 999px;
    padding: 5px 10px;
    border: 1px solid var(--border);
  }
  .priority.hot { background: var(--grad); border-color: transparent; }
  .priority.warm { color: #FFB84D; border-color: rgba(255,149,0,0.35); }
  .priority.cold { color: var(--text-faint); }
  .title { font-family: var(--syne); font-size: 20px; line-height: 1.15; }
  .brief { color: var(--text-dim); font-size: 12px; line-height: 1.65; }
  .angle {
    font-size: 11px;
    line-height: 1.6;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .card-actions button {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--card-2);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
  }
  .card-actions button:hover { background: var(--grad); border-color: transparent; }
  .empty {
    border: 1px dashed var(--border);
    border-radius: 18px;
    padding: 28px;
    color: var(--text-dim);
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Monthly Idea Set</div>
  <h1>April 2026</h1>
  <p class="sub">Starting point: starting point. This view is synced from the skill-driven idea generator and feeds the content pipeline.</p>
  <div class="rule"></div>

  <div class="nav">
    <a href="../../content_pipeline.html">Open Pipeline</a>
    <a href="../../ridwan_content_system_updated.html">Open Content System</a>
    <button type="button" id="copy-json">Copy JSON Summary</button>
  </div>

  <div class="stats">
    <div class="stat"><small>Total Ideas</small><strong id="stat-total">0</strong></div>
    <div class="stat"><small>Hot Priority</small><strong id="stat-hot">0</strong></div>
    <div class="stat"><small>CRO Fix</small><strong id="stat-cro">0</strong></div>
    <div class="stat"><small>Tips</small><strong id="stat-tip">0</strong></div>
  </div>

  <div class="toolbar">
    <button class="filter active" data-type="all">All</button>
    <button class="filter" data-type="Tip">Tip</button>
    <button class="filter" data-type="CRO Fix">CRO Fix</button>
    <button class="filter" data-type="Case Study">Case Study</button>
    <button class="filter" data-type="Personal">Personal</button>
    <input id="search" type="text" placeholder="Search ideas">
  </div>

  <div class="grid" id="ideas-grid"></div>
  <div class="empty" id="empty" hidden>No ideas match this filter.</div>
</div>

<script>
const DATA = {"monthLabel":"April 2026","monthSlug":"2026-04","monthMeta":{"label":"April 2026","slug":"2026-04","topic":"starting point","generatedAt":"2026-04-24T11:30:31.170Z","totalIdeas":15,"htmlPath":"outputs/ideas/ideas_2026-04.html","jsonPath":"outputs/ideas/ideas_2026-04.json"},"ideas":[{"title":"Your Mobile Menu Is Losing You 15% of Sales","brief":"Analysis of mobile navigation patterns that kill conversion - hamburger menu depth, search placement, and category visibility fixes that restored checkout flow","type":"CRO Fix","pillar":"Conversion Strategy","priority":"Hot","angle":"Specific mobile UX problem with conversion impact data"},{"title":"GSAP ScrollTrigger: 4 Animations That Actually Convert","brief":"Technical breakdown of scroll-triggered animations that enhance rather than distract - reveal patterns, progress indicators, and sticky elements with Liquid integration","type":"Tip","pillar":"Digital Craftsmanship","priority":"Warm","angle":"Advanced technical skill with business ROI"},{"title":"I Built 12 Stores in Q1. Here's What I Learned About Client Expectations","brief":"Personal reflection on managing scope creep, timeline expectations, and the 3 conversations that prevent 90% of project friction","type":"Personal","pillar":"Builder's Journey","priority":"Warm","angle":"Vulnerable insight from high-volume experience"},{"title":"Subscription Upsell Math: When Bundle Discounts Backfire","brief":"Case study of subscription box brand where 20% bundle discount decreased LTV by 35% - psychology of perceived value vs actual commitment","type":"Case Study","pillar":"Conversion Strategy","priority":"Hot","angle":"Counter-intuitive pricing strategy with real numbers"},{"title":"Figma Component System for Shopify: The 15-Minute Setup","brief":"Step-by-step component library that mirrors Shopify section structure - auto-layout, variants, and handoff annotations that eliminate developer guesswork","type":"Tip","pillar":"Digital Craftsmanship","priority":"Warm","angle":"Design First, Develop Fast framework in action"},{"title":"Why I Charge 50% More for Fashion Stores","brief":"The hidden complexity of fashion eCommerce - variant matrices, lookbook integration, size guide optimization, and why generic themes fail this vertical","type":"Personal","pillar":"Builder's Journey","priority":"Hot","angle":"Industry-specific pricing strategy revelation"},{"title":"Trust Signals That Kill Sales: The Over-Credibility Problem","brief":"Analysis of trust badge overload, review widget spam, and security seal redundancy - when too many trust signals create decision paralysis","type":"CRO Fix","pillar":"Conversion Strategy","priority":"Warm","angle":"Unexpected trust signal optimization angle"},{"title":"Instant Page Builder: Custom Section Architecture","brief":"Advanced Instant techniques for complex layouts - nested sections, conditional logic, and dynamic content blocks that maintain theme performance","type":"Tip","pillar":"Digital Craftsmanship","priority":"Cold","angle":"Deep tool expertise for advanced users"},{"title":"The Email Capture That Converted 47% of Mobile Traffic","brief":"Breakdown of exit-intent alternative for mobile - timing, copy, and incentive strategy that worked for direct-to-consumer wellness brand","type":"Case Study","pillar":"Conversion Strategy","priority":"Hot","angle":"Mobile-specific lead generation with high conversion data"},{"title":"My 3AM Debugging Sessions Taught Me This About Liquid","brief":"Personal story about liquid syntax gotchas, object relationships, and the debugging approach that saves hours of theme development frustration","type":"Personal","pillar":"Digital Craftsmanship","priority":"Warm","angle":"Vulnerable technical learning experience"},{"title":"Checkout Abandonment Fix: The Payment Method Order","brief":"A/B test results showing 12% conversion lift from reordering payment options - regional preferences and cognitive load considerations","type":"CRO Fix","pillar":"Conversion Strategy","priority":"Hot","angle":"Micro-optimization with significant impact"},{"title":"Design System Tokens for Shopify: CSS Custom Properties Setup","brief":"Implementation guide for scalable design systems using CSS variables - color schemes, spacing scales, and typography that work across theme updates","type":"Tip","pillar":"Digital Craftsmanship","priority":"Cold","angle":"Advanced design system methodology"},{"title":"I Lost a $15K Project Over This Communication Mistake","brief":"Story of project scope misalignment, the specific email that caused the breakdown, and the client communication framework developed to prevent repeats","type":"Personal","pillar":"Builder's Journey","priority":"Warm","angle":"Expensive lesson learned with prevention strategy"},{"title":"Product Video Placement: Above vs Below the Fold Data","brief":"Split test analysis across 8 stores comparing hero video placement - engagement rates, scroll behavior, and conversion impact by product category","type":"Case Study","pillar":"Conversion Strategy","priority":"Warm","angle":"Video optimization with cross-vertical data"},{"title":"Typography Hierarchy That Converts: The 6-Level System","brief":"Font weight, size, and spacing progression that guides purchase decisions - how typographic contrast creates conversion funnels within page layouts","type":"Tip","pillar":"Digital Craftsmanship","priority":"Cold","angle":"Design fundamentals with conversion focus"}]};
let activeType = 'all';
let query = '';

function updateStats() {
  document.getElementById('stat-total').textContent = DATA.ideas.length;
  document.getElementById('stat-hot').textContent = DATA.ideas.filter(item => item.priority === 'Hot').length;
  document.getElementById('stat-cro').textContent = DATA.ideas.filter(item => item.type === 'CRO Fix').length;
  document.getElementById('stat-tip').textContent = DATA.ideas.filter(item => item.type === 'Tip').length;
}

function escapeHtml(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function copyIdea(index) {
  const idea = DATA.ideas[index];
  const text = [idea.title, idea.brief, idea.angle].filter(Boolean).join('\n\n');
  navigator.clipboard.writeText(text);
}

function render() {
  const filtered = DATA.ideas.filter(item => {
    const typePass = activeType === 'all' || item.type === activeType;
    const text = [item.title, item.brief, item.angle, item.pillar].join(' ').toLowerCase();
    const searchPass = !query || text.includes(query);
    return typePass && searchPass;
  });

  const grid = document.getElementById('ideas-grid');
  const empty = document.getElementById('empty');
  if (!filtered.length) {
    grid.innerHTML = '';
    empty.hidden = false;
    return;
  }

  empty.hidden = true;
  grid.innerHTML = filtered.map(item => {
    const index = DATA.ideas.indexOf(item);
    return ''
      + '<article class="card">'
      +   '<div class="card-head">'
      +     '<span class="badge">' + escapeHtml(item.type) + '</span>'
      +     '<span class="priority ' + String(item.priority || '').toLowerCase() + '">' + escapeHtml(item.priority) + '</span>'
      +   '</div>'
      +   '<div class="title">' + escapeHtml(item.title) + '</div>'
      +   '<div class="brief">' + escapeHtml(item.brief) + '</div>'
      +   '<div class="angle">' + escapeHtml(item.angle) + '</div>'
      +   '<div class="card-meta">'
      +     '<span class="mini">' + escapeHtml(item.pillar) + '</span>'
      +     '<span class="mini">' + escapeHtml(DATA.monthLabel) + '</span>'
      +   '</div>'
      +   '<div class="card-actions">'
      +     '<button type="button" onclick="copyIdea(' + index + ')">Copy</button>'
      +   '</div>'
      + '</article>';
  }).join('');
}

document.querySelectorAll('.filter').forEach(button => {
  button.addEventListener('click', () => {
    document.querySelectorAll('.filter').forEach(node => node.classList.remove('active'));
    button.classList.add('active');
    activeType = button.dataset.type;
    render();
  });
});

document.getElementById('search').addEventListener('input', event => {
  query = event.target.value.trim().toLowerCase();
  render();
});

document.getElementById('copy-json').addEventListener('click', () => {
  navigator.clipboard.writeText(JSON.stringify(DATA.ideas, null, 2));
});

updateStats();
render();
</script>
</body>
</html>
