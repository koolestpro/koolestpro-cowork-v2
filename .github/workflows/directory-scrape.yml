name: Directory scrape to Outreach Sheet

# Runs in GitHub's cloud, so nothing depends on the Mac being awake.
# 06:30 UTC = 07:30 in Lagos. Needs two repo secrets: OUTREACH_API_URL and OUTREACH_API_TOKEN.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma list: merchantgenius,zik,eachspy,myipms (blank = all)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (nothing pushed to the Sheet)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: directory-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OUTREACH_API_URL: ${{ secrets.OUTREACH_API_URL }}
      OUTREACH_API_TOKEN: ${{ secrets.OUTREACH_API_TOKEN }}
      SCRAPER_STATE_DIR: outreach/scrapers/state-cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright certifi
          playwright install --with-deps chromium
      - name: Scrape and push
        run: |
          ARGS=""
          if [ -n "${{ inputs.sources }}" ]; then ARGS="$ARGS --sources ${{ inputs.sources }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python outreach/scrapers/directory_scrape.py $ARGS
      - name: Keep the seen-list so tomorrow only finds new stores
        if: always()
        run: |
          git config user.name "directory-scrape-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f outreach/scrapers/state-cloud/*.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Scraper state $(date -u +%F)"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push || true
          fi
      - name: Save the CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directory-leads
          path: outreach/scrapers/output/*.csv
          if-no-files-found: ignore
